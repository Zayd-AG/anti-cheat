services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anti_cheat
      POSTGRES_USER: anti_cheat
      POSTGRES_PASSWORD: anti_cheat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti_cheat -d anti_cheat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://anti_cheat:anti_cheat@postgres:5432/anti_cheat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://anti_cheat:anti_cheat@postgres:5432/anti_cheat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
